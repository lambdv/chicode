[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"
